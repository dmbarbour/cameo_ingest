[project]
name = "cameo-ingest"
version = "0.20.1"
description = "Convert Cameo / MagicDraw project files (.mdzip, .mdzipx, .rdzip) into provenance-tagged Markdown, CSV and JSON for RAG ingestion"
readme = "README.md"
authors = [
    { name = "David Barbour", email = "dmbarbour@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "lxml>=6.1.3",
    "networkx>=3.7",
    "openai>=3.19.0",
    "pillow>=12.3.0",
    "python-dotenv>=1.2.3",
    "tqdm>=4.70.1",
    "xlsxwriter>=3.2.9",
]

[project.optional-dependencies]
# The retrieval evaluation (cameo_ingest.evaluation): not needed for ingesting.
eval = [
    "numpy>=2.5.3",
    "tokenizers>=0.23.2",
]

[project.scripts]
cameo-ingest = "cameo_ingest.cli:main"

[build-system]
requires = ["uv_build>=0.12.18,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
# Enrichment and per-stream parsing deliberately catch broad exceptions so one bad
# stream or LLM call never aborts an ingest.
ignore = ["BLE001"]

[tool.pytest.ini_options]
markers = [
    "slow: runs on large sample models (minutes); run with `pytest -m slow`",
    "llm: uses a real LLM endpoint from the environment or .env; run with `pytest -m llm`",
]
testpaths = ["tests"]  # not out/, which can hold gigabytes of trees
addopts = "-m 'not slow and not llm'"
